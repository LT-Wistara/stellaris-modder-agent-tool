server {
    listen 80;
    listen [::]:80;
    server_name 47.96.162.46;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://47.96.162.46$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 47.96.162.46;

    ssl_certificate /etc/letsencrypt/live/stellaris-mcp-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellaris-mcp-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    # The MCP server has no authentication layer, so this proxy is the only
    # gate in front of it: restrict access here (client certificates, source
    # allow-list, or an auth_request) before exposing this vhost.
    location = /mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Origin "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
