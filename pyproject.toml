[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stellaris-modder-agent-tool"
version = "0.1.3"
description = "Offline, provenance-first Stellaris CWT search and validation MCP server"
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
gui = ["customtkinter==5.2.2", "pillow==11.3.0"]

[project.scripts]
stellaris-modder-agent-tool = "stellaris_modder_agent.cli:main"

[tool.setuptools.packages.find]
include = ["stellaris_modder_agent*"]

[tool.setuptools.package-data]
stellaris_modder_agent = ["data/config/*.cwt", "data/config/**/*.cwt", "data/LICENSE.cwt", "data/UPSTREAM.json"]
